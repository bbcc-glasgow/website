# Decap CMS configuration for BBCC website
# Uses git-gateway backend via DecapBridge for authenticated content editing.

backend:
  name: git-gateway
  repo: bbcc-glasgow/website
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/648cbae2-8402-4cde-ade9-014199b3e953/pkce
  auth_token_endpoint: /sites/648cbae2-8402-4cde-ade9-014199b3e953/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://bbcc.scot

# All edits create a pull request rather than pushing directly to main.
publish_mode: editorial_workflow

media_folder: public/images
public_folder: /images

collections:
  - name: projects
    label: Projects
    label_singular: Project
    description: Community council projects and initiatives
    folder: src/content/projects
    extension: .json
    format: json
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { name: tag, label: Tag, widget: string }
      - { name: tagColour, label: Tag Colour, widget: string }
      - { name: tagBgColour, label: Tag Background Colour, widget: string }
      - { name: borderColour, label: Border Colour, widget: string }
      - { name: title, label: Title, widget: string }
      - { name: summary, label: Summary, widget: text }
      - { name: details, label: Details, widget: text }
      - { name: order, label: Order, widget: number, value_type: int }

  - name: site
    label: Site Facts
    description: Site-wide configuration data, statistics, and contact information
    files:
      - file: src/content/site/index.json
        name: index
        label: Site Facts
        fields:
          - name: stats
            label: Statistics
            widget: list
            summary: "{{fields.value}} {{fields.label}}"
            fields:
              - { name: value, label: Value, widget: string }
              - { name: label, label: Label, widget: string }
              - { name: desc, label: Description, widget: string }
              - { name: countValue, label: Count Value, widget: number, value_type: int, required: false }
              - { name: prefix, label: Prefix, widget: string, required: false }
              - { name: suffix, label: Suffix, widget: string, required: false }
              - { name: valueStyle, label: Value Style, widget: string, required: false }
              - { name: duration, label: Duration (ms), widget: number, value_type: int, required: false }
          - { name: boundaryDescription, label: Boundary Description, widget: text }
          - { name: contactEmail, label: Contact Email, widget: string }

  - name: holding
    label: Holding Page
    description: Editable content for the site's holding page
    files:
      - file: src/content/holding/index.json
        name: index
        label: Holding Page
        fields:
          - { name: eyebrow, label: Eyebrow, widget: string }
          - { name: heading, label: Heading, widget: string }
          - { name: body, label: Body, widget: text }
          - { name: ctaLabel, label: CTA Label, widget: string }
