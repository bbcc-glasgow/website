# Decap CMS configuration for BBCC website
# Uses git-gateway backend via DecapBridge for authenticated content editing.

backend:
  name: git-gateway
  repo: bbcc-glasgow/website
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/648cbae2-8402-4cde-ade9-014199b3e953/pkce
  auth_token_endpoint: /sites/648cbae2-8402-4cde-ade9-014199b3e953/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Edit the checked-out working tree instead of the repo, so a change to this
# file can be tried before it is merged. `branch: main` above means every
# deployed /admin — production and PR preview alike — loads content from main,
# so a preview deploy shows the PR's new config against main's old content and
# reports errors on entries the PR has already migrated. Run `pnpm cms`
# alongside `pnpm dev` and localhost:4321/admin/index.html reads the branch you
# are on. (The filename is needed only under `astro dev`, which serves public/
# without resolving a directory to its index.)
#
# Safe to ship: Decap only talks to the proxy when the page is served from
# localhost or 127.0.0.1, and widening that needs an explicit allowed_hosts
# which is not set. On bbcc.scot this line does nothing.
local_backend: true

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://bbcc.scot

# All edits create a pull request rather than pushing directly to main.
publish_mode: editorial_workflow

media_folder: public/images
public_folder: /images

