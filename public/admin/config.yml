              - { name: newTab, label: Open in a new tab, widget: boolean, required: false, default: false }
              - { name: icon, label: Icon, widget: select, options: ["arrow-right", "external", "mail", "calendar", "map-pin", "download", "document"], required: false }
          - name: document
            label: Document
            widget: object
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: Label, widget: string }
              - name: file
                label: File
                widget: file
                hint: Uploaded to the site. Its type and size are shown on the button automatically.
                media_folder: /public/documents
                public_folder: /documents
              - { name: newTab, label: Open in a new tab, widget: boolean, required: false, default: true }
              - { name: icon, label: Icon, widget: select, options: ["arrow-right", "external", "mail", "calendar", "map-pin", "download", "document"], required: false }
          - name: contact
            label: Email us
            widget: object
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: Label, widget: string }
              - { name: subject, label: Subject line, widget: string, required: false, hint: "Prefills the reader's email. Leave blank for none." }
              - { name: newTab, label: Open in a new tab, widget: boolean, required: false, default: false }
              - { name: icon, label: Icon, widget: select, options: ["arrow-right", "external", "mail", "calendar", "map-pin", "download", "document"], required: false }
          - name: social
            label: Social profile
            widget: object
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: Label, widget: string }
              - { name: platform, label: Platform, widget: select, options: ["instagram", "facebook"] }
              - { name: newTab, label: Open in a new tab, widget: boolean, required: false, default: true }
              - { name: icon, label: Icon, widget: select, options: ["arrow-right", "external", "mail", "calendar", "map-pin", "download", "document"], required: false }

  - name: site
    label: Site Settings
    description: Site-wide configuration data, statistics, and contact information
    files:
      - file: src/content/site/index.json
        name: index
        label: Site Settings
        fields:
          - name: stats
            label: Statistics
            widget: list
            summary: "{{fields.value}} {{fields.label}}"
            fields:
              - { name: value, label: Value, widget: string }
              - { name: label, label: Label, widget: string }
              - { name: desc, label: Description, widget: string }
              - { name: countValue, label: Count Value, widget: number, value_type: int, required: false }
              - { name: prefix, label: Prefix, widget: string, required: false }
              - { name: suffix, label: Suffix, widget: string, required: false }
              - { name: valueStyle, label: Value Style, widget: string, required: false }
              - { name: duration, label: Duration (ms), widget: number, value_type: int, required: false }
          - { name: boundaryDescription, label: Boundary Description, widget: text }
          - { name: contactEmail, label: Contact Email, widget: string }
          - { name: legalName, label: Full Legal Name, widget: string }
          - name: description
            label: What The Council Is
            widget: text
            hint: One paragraph. Used in the page text and in the structured data search engines read.
          - name: venue
            label: Meeting Venue
            widget: object
            collapsed: true
            fields:
              - { name: name, label: Venue Name, widget: string }
              - { name: streetAddress, label: Street Address, widget: string }
              - { name: addressLocality, label: Town or City, widget: string }
              - { name: postalCode, label: Postcode, widget: string }
              - { name: addressCountry, label: Country Code, widget: string, hint: "Two letters, e.g. GB" }
              - { name: accessNote, label: Accessibility Note, widget: text }
          - name: meetingCalendar
            label: Meeting Calendar
            widget: object
            collapsed: true
            hint: >-
              Meeting dates come from the council's Google Calendar and are read
              afresh every time the site is built. To add, move or cancel a
              meeting, change it in Google Calendar - there is nothing to edit
              here. This address only changes if the council moves to a
              different calendar.
            fields:
              - name: icsUrl
                label: Public iCal Address
                widget: string
                pattern: ["^https://.*\\.ics$", "Must be an https address ending in .ics"]
                hint: >-
                  From Google Calendar settings, under "Integrate calendar": the
                  PUBLIC address in iCal format. Not the secret one - that is a
                  password, and this file is public.
          - name: meetingDetails
            label: Meeting Details
            widget: object
            collapsed: true
            hint: The two things about a meeting that a calendar entry cannot hold. Everything else comes from Google Calendar.
            fields:
              - { name: doorsOpen, label: Doors Open, widget: string, hint: "24-hour clock, e.g. 19:00. The calendar holds the start time; this is when people can arrive." }
              - { name: attendanceNote, label: How To Attend, widget: text }
          - name: areaPartnership
            label: Area Partnership
            widget: object
            collapsed: true
            fields:
              - { name: name, label: Partnership Name, widget: string }
              - { name: parentBody, label: Parent Body, widget: string }
          - name: officeBearers
            label: Office Bearers
            widget: list
            summary: "{{fields.role}}"
            hint: Roles are always shown. A name is optional, appears as ordinary page text, and is never put into the structured data.
            fields:
              - { name: role, label: Role, widget: string }
              - { name: name, label: Name, widget: string, required: false }
          - name: socialProfiles
            label: Social Profiles
            widget: list
            hint: Full URLs of accounts the council currently runs. These are published as the council's official profiles, so do not list an account that has been handed over or abandoned.
            field: { name: url, label: Profile URL, widget: string }
          - name: predecessorSite
            label: Previous Website
            widget: string
            required: false
            hint: The old site this one replaces. Naming it tells anyone who finds both which is current.

