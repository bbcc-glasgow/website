              - { name: body, label: Body, widget: text, hint: "Leave a blank line between paragraphs." }
              - name: ctas
                label: Call to Action Buttons
                widget: list
                summary: "{{fields.label}}"
                # Four kinds of destination, so the editor is only ever shown the
                # fields their choice needs. Two of them carry no address at all:
                # Email us and Social profile read the address from Site Settings,
                # so it is written down once and cannot go stale in one button.
                types:
                  - name: link
                    label: Link
                    widget: object
                    summary: "{{fields.label}}"
                    fields:
                      - { name: label, label: Label, widget: string }
                      - { name: url, label: URL, widget: string, hint: "#section on this page, /another-page, or a full https:// address" }
                      - { name: newTab, label: Open in a new tab, widget: boolean, required: false, default: false }
