# Decap CMS configuration for BBCC website
# Uses git-gateway backend via DecapBridge for authenticated content editing.

backend:
  name: git-gateway
  repo: bbcc-glasgow/website
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/648cbae2-8402-4cde-ade9-014199b3e953/pkce
  auth_token_endpoint: /sites/648cbae2-8402-4cde-ade9-014199b3e953/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://bbcc.scot

# All edits create a pull request rather than pushing directly to main.
publish_mode: editorial_workflow

media_folder: public/images
public_folder: /images

collections:
  - name: pages
    label: Pages
    description: Page copy for the public site
    files:
      - file: src/content/pages/index.json
        name: index
        label: Homepage
        fields:
          - name: hero
            label: Hero
            widget: object
            collapsed: true
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Body, widget: text }
              - name: ctas
                label: Call to Action Buttons
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: url, label: URL, widget: string }
          - name: ourArea
            label: Our Area
            widget: object
            collapsed: true
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: body1, label: Body Paragraph 1, widget: text }
              - { name: body2, label: Body Paragraph 2, widget: text }
              - { name: boundaryLabel, label: Boundary Label, widget: string }
              - name: pillars
                label: Pillar Cards
                widget: list
                summary: "{{fields.heading}}"
                fields:
                  - { name: heading, label: Heading, widget: string }
                  - { name: body, label: Body, widget: text }
          - name: ourProjects
            label: Projects Intro
            widget: object
            collapsed: true
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: heading, label: Heading, widget: string }
              - name: ideaCard
                label: Have an Idea Card
                widget: object
                collapsed: true
                fields:
                  - { name: heading, label: Heading, widget: string }
                  - { name: body, label: Body, widget: text }
                  - name: cta
                    label: Call to Action
                    widget: object
                    collapsed: true
                    fields:
                      - { name: label, label: Label, widget: string }
                      - { name: url, label: URL, widget: string }
          - name: jag
            label: Joint Action Group
            widget: object
            collapsed: true
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Body, widget: text }
              - name: cards
                label: Neighbouring Council Areas
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: Area Name, widget: string }
                  # Optional, and left empty until somebody has confirmed the
                  # council's own page. A name with no link is a name; a name
                  # with a guessed link is a wrong answer.
                  - { name: url, label: Council Website (optional), widget: string, required: false, pattern: ["^https://", "Must start with https://"] }
          - name: getInvolved
            label: Get Involved
            widget: object
            collapsed: true
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Body, widget: text }
              - name: cards
                label: Involvement Cards
                widget: list
                summary: "{{fields.heading}}"
                fields:
                  - { name: heading, label: Heading, widget: string }
                  - { name: body, label: Body, widget: text }
                  # A list, because the Follow Us card needs two buttons and
                  # splitting it into two cards to get them would be silly.
                  - name: ctas
                    label: Buttons
                    widget: list
                    summary: "{{fields.label}}"
                    fields:
                      - { name: label, label: Label, widget: string }
                      - { name: url, label: URL, widget: string }
          - name: meetings
            label: Meetings Intro
            widget: object
            collapsed: true
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Intro Body, widget: text }
              - name: cta
                label: Call to Action
                widget: object
                collapsed: true
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: url, label: URL, widget: string }
          - name: newsletter
            label: Newsletter
            widget: object
            collapsed: true
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Body, widget: text }
              - { name: ctaLabel, label: CTA Label, widget: string }
              - { name: subtext, label: Subtext, widget: string }
          - name: instagram
            label: Instagram
            widget: object
            collapsed: true
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Body, widget: text }
              - { name: instagramCtaLabel, label: Instagram CTA Label, widget: string }
              - { name: facebookCtaLabel, label: Facebook CTA Label, widget: string }
      - file: src/content/pages/holding.json
        name: holding
        label: Holding Page
        fields:
          - { name: eyebrow, label: Eyebrow, widget: string }
          - { name: heading, label: Heading, widget: string }
          - { name: body, label: Body, widget: text }
          - { name: ctaLabel, label: CTA Label, widget: string }

  - name: projects
    label: Projects
    label_singular: Project
    description: Community council projects and initiatives
    folder: src/content/projects
    extension: .json
    format: json
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { name: tag, label: Tag, widget: string }
      - { name: variant, label: Variant, widget: select, options: ["teal", "pink", "amber"], default: "teal" }
      - { name: title, label: Title, widget: string }
      - { name: summary, label: Summary, widget: text }
      - { name: order, label: Order, widget: number, value_type: int }
      - name: ctas
        label: Call to Action Buttons
        widget: list
        required: false
        summary: "{{fields.label}}"
        fields:
          - { name: label, label: Label, widget: string }
          - { name: url, label: URL, widget: string }
          - { name: icon, label: Icon, widget: select, options: ["arrow-right", "external", "mail", "calendar", "map-pin", "download"], required: false }

  - name: site
    label: Site Settings
    description: Site-wide configuration data, statistics, and contact information
    files:
      - file: src/content/site/index.json
        name: index
        label: Site Settings
        fields:
          - name: stats
            label: Statistics
            widget: list
            summary: "{{fields.value}} {{fields.label}}"
            fields:
              - { name: value, label: Value, widget: string }
              - { name: label, label: Label, widget: string }
              - { name: desc, label: Description, widget: string }
              - { name: countValue, label: Count Value, widget: number, value_type: int, required: false }
              - { name: prefix, label: Prefix, widget: string, required: false }
              - { name: suffix, label: Suffix, widget: string, required: false }
              - { name: valueStyle, label: Value Style, widget: string, required: false }
              - { name: duration, label: Duration (ms), widget: number, value_type: int, required: false }
          - { name: boundaryDescription, label: Boundary Description, widget: text }
          - { name: contactEmail, label: Contact Email, widget: string }
          - { name: legalName, label: Full Legal Name, widget: string }
          - name: description
            label: What The Council Is
            widget: text
            hint: One paragraph. Used in the page text and in the structured data search engines read.
          - name: venue
            label: Meeting Venue
            widget: object
            collapsed: true
            fields:
              - { name: name, label: Venue Name, widget: string }
              - { name: streetAddress, label: Street Address, widget: string }
              - { name: addressLocality, label: Town or City, widget: string }
              - { name: postalCode, label: Postcode, widget: string }
              - { name: addressCountry, label: Country Code, widget: string, hint: "Two letters, e.g. GB" }
              - { name: accessNote, label: Accessibility Note, widget: text }
          - name: meetingCalendar
            label: Meeting Calendar
            widget: object
            collapsed: true
            hint: >-
              Meeting dates come from the council's Google Calendar and are read
              afresh every time the site is built. To add, move or cancel a
              meeting, change it in Google Calendar - there is nothing to edit
              here. This address only changes if the council moves to a
              different calendar.
            fields:
              - name: icsUrl
                label: Public iCal Address
                widget: string
                pattern: ["^https://.*\\.ics$", "Must be an https address ending in .ics"]
                hint: >-
                  From Google Calendar settings, under "Integrate calendar": the
                  PUBLIC address in iCal format. Not the secret one - that is a
                  password, and this file is public.
          - name: meetingDetails
            label: Meeting Details
            widget: object
            collapsed: true
            hint: The two things about a meeting that a calendar entry cannot hold. Everything else comes from Google Calendar.
            fields:
              - { name: doorsOpen, label: Doors Open, widget: string, hint: "24-hour clock, e.g. 19:00. The calendar holds the start time; this is when people can arrive." }
              - { name: attendanceNote, label: How To Attend, widget: text }
          - name: areaPartnership
            label: Area Partnership
            widget: object
            collapsed: true
            fields:
              - { name: name, label: Partnership Name, widget: string }
              - { name: parentBody, label: Parent Body, widget: string }
          - name: officeBearers
            label: Office Bearers
            widget: list
            summary: "{{fields.role}}"
            hint: Roles are always shown. A name is optional, appears as ordinary page text, and is never put into the structured data.
            fields:
              - { name: role, label: Role, widget: string }
              - { name: name, label: Name, widget: string, required: false }
          - name: socialProfiles
            label: Social Profiles
            widget: list
            hint: Full URLs of accounts the council currently runs. These are published as the council's official profiles, so do not list an account that has been handed over or abandoned.
            field: { name: url, label: Profile URL, widget: string }
          - name: predecessorSite
            label: Previous Website
            widget: string
            required: false
            hint: The old site this one replaces. Naming it tells anyone who finds both which is current.

