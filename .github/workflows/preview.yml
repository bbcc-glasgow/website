# Per-PR Cloudflare Workers preview deploys.
#
# Every Decap CMS edit creates a real PR. This workflow gives reviewers a live
# preview URL on Workers (never the production domain) so they see the actual
# rendered Astro site with SITE_MODE=live — not a hand-rolled preview template
# that would drift from the real layout.
#
# Release boundary (ADR-0005): this workflow uses `wrangler versions upload`,
# never `wrangler deploy`. It does not touch the production domain or the
# production Worker version. The only path to bbcc.scot is deploy.yml.
name: preview-deploy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

env:
  WRANGLER_VERSION: "4.115.0"

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Upload preview version to Cloudflare Workers
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          OUTPUT=$(npx "wrangler@${WRANGLER_VERSION}" versions upload \
            --var "SITE_MODE:live" \
            --message "Preview PR #${{ github.event.number }} (${{ github.event.pull_request.head.sha }})" 2>&1)
          echo "${OUTPUT}"
          # Extract the version UUID from wrangler output (e.g.
          # "Uploaded version a1b2c3d4-e5f6-7890-abcd-ef1234567890").
          VERSION_ID=$(echo "${OUTPUT}" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          if [ -z "${VERSION_ID}" ]; then
            echo "::error::Failed to extract version ID from wrangler output"
            exit 1
          fi
          echo "version_id=${VERSION_ID}" >> "${GITHUB_OUTPUT}"

      - name: Look up workers.dev subdomain and build preview URL
        id: url
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          SUBDOMAIN=$(npx "wrangler@${WRANGLER_VERSION}" whoami 2>&1 | \
            grep -oE 'workers\.dev.*subdomain:\s+\S+' | \
            grep -oE '\S+$' | head -1)
          if [ -z "${SUBDOMAIN}" ]; then
            echo "::error::Could not determine workers.dev subdomain. Ensure your Cloudflare account has a workers.dev subdomain enabled for preview deployments."
            exit 1
          fi
          echo "subdomain=${SUBDOMAIN}" >> "${GITHUB_OUTPUT}"
          echo "url=https://${{ steps.upload.outputs.version_id }}.bbcc-website.${SUBDOMAIN}.workers.dev" >> "${GITHUB_OUTPUT}"

      - name: Post preview URL as PR comment (create or update in place)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/preview-comment.md <<COMMENTEOF
          ## Preview deployment

          A preview of this PR is available at:

          **[${{ steps.url.outputs.url }}](${{ steps.url.outputs.url }})**

          This preview renders with \`SITE_MODE=live\` so you can see the real site with this PR's changes.

          > This preview was created from commit ${{ github.event.pull_request.head.sha }}.
          COMMENTEOF

          # Find existing preview comment posted by this workflow on prior pushes.
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("## Preview deployment"))) | .id' | head -1)

          if [ -n "${EXISTING}" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${EXISTING}" -X PATCH -f "body@/tmp/preview-comment.md"
          else
            gh api "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" -X POST -f "body@/tmp/preview-comment.md"
          fi
