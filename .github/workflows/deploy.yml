# Release boundary (ADR-0005): merges to main do NOT publish. A human tags a
# release (v*) or dispatches this workflow manually — that tap is the deploy.
name: deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          # v3 of the action bundles wrangler 3.x, which cannot read the
          # Workers static-assets config (main + assets) — pin wrangler 4.
          wranglerVersion: "4.115.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
