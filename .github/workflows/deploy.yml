# Release boundary (continuous deploy; supersedes ADR-0005 release tap):
# every push to main deploys to production, so a merged PR (including Decap CMS
# publishes) goes live with no further human action. Manual dispatch redeploys
# current main as a fallback/redeploy path. A v* tag does not trigger a deploy.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialise production deploys: back-to-back merges (e.g. several CMS publishes)
# must not race. cancel-in-progress means the newest push cancels an older
# in-flight deploy, so an older commit can never end up live after a newer one.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          # v3 of the action bundles wrangler 3.x, which cannot read the
          # Workers static-assets config (main + assets) — pin wrangler 4.
          wranglerVersion: "4.115.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
