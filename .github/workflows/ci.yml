name: gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # actionlint has no major-version tag (v1 does not exist upstream), so
      # install the binary with the official download script instead of pinning
      # a third-party action reference.
      - name: Lint workflow files (actionlint)
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
        shell: bash

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Gate
        run: ./gate.sh
